services:
  - type: web
    name: multimodal-misinformation-analyzer
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: misinformation-db
          property: connectionString
      - key: SEED_DEFAULT_ADMIN
        value: "true"
      - key: DEFAULT_ADMIN_EMAIL
        sync: false
      - key: DEFAULT_ADMIN_USERNAME
        sync: false
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false

databases:
  - name: misinformation-db
    plan: free
    region: ohio
